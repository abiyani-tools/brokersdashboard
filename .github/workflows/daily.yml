name: daily
# Switched on once live mode passes its checks (Build Plan v2, phase 4).
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY (never commit keys).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 14 * * 1-5'   # 19:30 IST, after exchange files post
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Check secrets are present
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY"
      - name: Parity gate
        run: python -m pytest tests/ -q
      - name: Live dry run from the DB (E5 -> engine a-i -> E1 coverage -> Summary rows; no DB writes)
        run: python run_live.py --db
      - name: Keep the run's report and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run
          path: out/live/
          retention-days: 30
      # Next (phase 4, needs AB's OK): publish to sb_runs / sb_daily_revenue / sb_summary_cells / sb_calibration,
      # then switch on the schedule above.
