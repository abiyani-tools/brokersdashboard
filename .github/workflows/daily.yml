name: daily
# Daily live run (PLAN 4.1), switched on 23 Oct 2026 with AB's OK.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY (never commit keys); the first step stops the job
# if either is missing. A run whose E5 checks block is not published (the job fails and keeps the report).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1-5'    # 19:47 IST, Mon-Fri, after the exchange files post
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Check secrets are present
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY"
      - name: Parity gate
        run: python -m pytest tests/ -q
      - name: Live run from the DB and publish (E5 -> engine a-i -> E1 coverage -> Summary rows -> sb_*)
        run: python run_live.py --db --publish
      - name: Keep the run's report and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run
          path: out/live/
          retention-days: 30
