name: daily
# Daily live run (PLAN 4.1), switched on 23 Oct 2026 with AB's OK.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY (never commit keys); the first step stops the job
# if either is missing. A run whose E5 checks block is not published (the job fails and keeps the report).
# Angel One, Groww and MOSL: `--broker all` runs Angel One, then Groww from the same Angel run (Groww borrows its calibration),
# then MOSL (own inputs, same snapshot, no Angel calibration), then publishes the three, each as its own sb_runs row.
# Groww and MOSL are each refused unless every fact they read is 'reviewed' (and their workbook inputs are in the database):
# that is a warning annotation on the job, the others still publish and the job stays green. Any other Groww / MOSL error
# fails the job after the others have been published. MOSL has its own as-of date (the last day its inputs are complete:
# NSE index-option contracts, BSE contracts, NSE / BSE cash turnover, MCX), possibly earlier than the others'; a MOSL run
# whose E5 checks block (a zero or non-ok day in one of its series) is not published, warns, and fails the job.
# Groww IR archive (step "Archive Groww's investor-relations page"): groww.in keeps no daily history, so each day's page is
# stored in sb_broker_daily (src/live/refresh_groww_ir.py; table: out/groww/migration_sb_broker_daily.sql, applied by AB).
# The step is continue-on-error: if groww.in blocks GitHub's runners (HTTP 403) or the page structure changes, the step shows
# red in the job, prints an error annotation, and the "Groww IR archive failed" step adds a warning to the job summary; the
# live run still goes ahead. The raw page is kept as the artifact groww-ir-raw. Fallback from AB's Mac: docs/GROWW_LIVE_SPEC.md,
# "Running the archive from AB's Mac". Groww's switch g-i (signed off) reads this archive; g-h is off.
# Industry MTF book: the `nse` rows of the owner's public dashboard/data/mtf_daily.json; also their view
# codex_public_nse_mtf_daily with their read-only key (secret NSE_LAKE_ANON_KEY), which has answered 401 since 2 Nov 2026.
# GITHUB_TOKEN (the job's own token) lifts GitHub's 60-an-hour limit on the refresh's commits lookups (403 on 4 Nov 2026).
# Schedule (AB, 10 Nov 2026): day D's ADR must be published by 06:00 IST on D+1. ExchangesDash's files for D land
# ~01:00-03:30 IST on D+1 (19:47 IST was before them, and GitHub started that run 5-8 h late). Two tries, 02:00 and
# 04:30 IST, Tue-Sat IST (= Mon-Fri UTC); a second run that finds no new day republishes the same as-of date.
# The 'freshness' workflow checks at 06:15 IST and fails, with the cause, if any broker is behind.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'    # 02:00 IST, Tue-Sat
    - cron: '0 23 * * 1-5'     # 04:30 IST, Tue-Sat
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NSE_LAKE_ANON_KEY: ${{ secrets.NSE_LAKE_ANON_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: Check secrets are present
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY"
      - name: Parity gate
        run: python -m pytest tests/ -q
      # Read only from ExchangesDash's public JSON; if GitHub is unreachable the run goes on with the rows
      # already in sb_market_daily (the step shows as failed, and E5 still checks every input)
      - name: Refresh NSE / BSE volumes in sb_market_daily from ExchangesDash
        continue-on-error: true
        run: python -m src.live.refresh_market --write
      - name: Archive Groww's investor-relations page into sb_broker_daily
        id: groww_ir
        continue-on-error: true
        run: python -m src.live.refresh_groww_ir --write
      - name: Groww IR archive failed (groww.in blocked, page changed, or table missing)
        if: steps.groww_ir.outcome == 'failure'
        run: |
          echo "::warning title=Groww IR archive failed::today's Groww investor-relations page was NOT archived (see the archive step above); archive it from the Mac: docs/GROWW_LIVE_SPEC.md"
          echo "### Groww IR archive FAILED today: no sb_broker_daily rows were written" >> "$GITHUB_STEP_SUMMARY"
      # Share prices for the dashboard's price vs ADR-DMA charts (src/live/refresh_prices.py): full Yahoo history each run
      # (Yahoo restates the past after a split); a failure warns and never stops the ADR run. Also: workflow 'prices'.
      - name: Share prices into sb_share_prices (Yahoo, ANGELONE / MOTILALOFS / GROWW)
        continue-on-error: true
        run: python -m src.live.refresh_prices --write
      - name: Live run from the DB and publish, Angel One then Groww then MOSL (E5 -> engine -> E1 coverage -> Summary rows -> sb_*)
        run: python run_live.py --db --publish --broker all
      - name: PAT model from the published runs into sb_pat_lines (Angel One, Groww)
        id: pat
        continue-on-error: true
        run: python run_pat.py --db --publish --broker all
      - name: PAT model failed (table missing, facts not reviewed, or an input gap)
        if: steps.pat.outcome == 'failure'
        run: |
          echo "::warning title=PAT model not published::see the PAT step above; the ADR run is unaffected"
          echo "### PAT model NOT published today (ADR runs unaffected)" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the raw Groww IR page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groww-ir-raw
          path: out/groww_ir/
          if-no-files-found: ignore
          retention-days: 90
      - name: Keep the run's report and inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run
          path: |
            out/live/
            out/pat/
          retention-days: 30
