name: filings
# Filing watcher (PLAN 4.2): new ANGELONE filings on NSE -> sb_documents + staged sb_disclosure_facts, for AB to review.
# Scheduled runs are dry runs (nothing written) until AB sets the repository variable FILINGS_WRITE to 'true';
# a manual run can write with the 'write' box. The job summary says what was found; out/filings/ is kept.
# Needs repository secrets SUPABASE_URL, SUPABASE_SERVICE_KEY (never commit keys).
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'First announcement date (YYYY-MM-DD); empty = 45 days back'
        required: false
        default: ''
      write:
        description: 'Insert new documents and staged facts'
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * *'     # 09:00 IST: monthly business updates post ~07:30-08:05 IST
    - cron: '0 14 * * *'     # 19:30 IST: results, decks and press releases post ~17:15-18:50 IST
jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SINCE: ${{ inputs.since }}
      WRITE: ${{ (github.event_name == 'workflow_dispatch' && inputs.write) || (github.event_name == 'schedule' && vars.FILINGS_WRITE == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install -r requirements.txt
      - name: Check secrets are present
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_KEY"
      - name: Watch NSE announcements (stage new filings)
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$WRITE" = "true" ]; then args+=(--write); fi
          echo "args: ${args[*]}"
          python run_watch.py "${args[@]}"
      - name: Keep the summary, payload and downloaded PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filings
          path: |
            out/filings/
            data/raw/disclosures/angelone/
          if-no-files-found: ignore
          retention-days: 90
